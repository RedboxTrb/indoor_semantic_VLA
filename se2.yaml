%YAML:1.2
# SPDX-FileCopyrightText: 2021-2023 Smart Robotics Lab, Imperial College London, Technical University of Munich
# SPDX-License-Identifier: CC0-1.0

general:
  results_directory:          "/tmp/habitat_okvis_meshes"
  write_mesh_output: true

  # sim_rgbd: 2x downsampling
  sensor_measurement_downsampling: 2
  depth_image_resolution_downsampling: 2

  # sim_rgbd submap thresholds
  submap_kf_threshold: 20
  submap_overlap_ratio: 0.1
  submap_min_frames: 40
  near_plane: 0.4
  far_plane: 4.0

  # sim_rgbd: alignment factors enabled
  use_map_to_map_factors: true
  use_map_to_live_factors: true
  n_factors_per_state: 200
  sensor_error: 0.4

  use_uncertainty: false

map:
  # sim_rgbd: 25.6m cube at 2.5cm voxels
  dim:            [25.6, 25.6, 25.6]
  res:            0.025

data:
  surface_boundary:        0
  min_occupancy:           -100
  max_occupancy:            100
  log_odd_min:             -5.015
  log_odd_max:              5.015
  fs_integr_scale:         1
  const_surface_thickness: false
  uncertainty_model:       quadratic
  tau_min_factor:          3
  tau_max_factor:          12
  k_tau:                   0.02
  sigma_min_factor:        1
  sigma_max_factor:        20
  k_sigma:                 0.05
